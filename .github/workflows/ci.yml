name: CI

on:
  push:
    branches: [main]
    # **Tags run CI too, and the release depends on it — B315.**
    #
    # `release.yml`'s `Wait for CI` asks `gh run list --commit <sha> --workflow
    # CI`, so what it proves is whatever CI ran for that COMMIT. The B315
    # ruling narrows the macOS and Windows legs off every push to main, on the
    # stated grounds that "a release still proves all three OSes on the commit
    # it publishes" — and that was not true as the workflows stood, because
    # nothing here triggered on a tag at all. Narrowing without this line would
    # have left a release publishing something never run on macOS or Windows,
    # which is what `byollm_010 §2` forbids one file over, and what the alpha
    # that shipped an unusable daemon cost.
    #
    # Driven rather than assumed: `on.push.branches` alone does not match a tag
    # ref, and `Wait for CI` reports "missing" rather than failing when no run
    # exists — so the gap would have been a release that waited twenty minutes
    # and then passed, not one that refused.
    tags: ["v*"]
  pull_request:
  # The nightly, which is what makes the narrowing safe on ordinary days: a
  # B313-shaped break — red only on Windows, invisible to a macOS laptop — is
  # caught within a day rather than at the next release.
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The latest LTS line. Node 22 went to maintenance when 24 became LTS, and
  # trusted publishing needs >= 22.14 — so an old pin here fails a release for
  # a reason the error message never connects to CI.
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Build first: packages resolve each other through their published
      # `dist` types, so both linting and typechecking need them to exist and
      # to be current. Linting a stale `dist` reports `any` for real types.
      - run: pnpm run build
      # Run the built binary as a binary. Everything else drives the CLI
      # in-process, which is how a no-output `dist/bin.js` shipped once.
      - run: pnpm run smoke
      # The landing page makes claims about the API. Check them.
      - run: pnpm run check:site
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run knip
      - run: pnpm run dupes
      # docs/standards.md: every example executes in CI so docs cannot rot.
      - run: pnpm --filter @byollm/example-demo run check
      # The five `verify` steps that were local-only until 09-18, and the
      # repository is PUBLIC: a contributor's pull request runs this job and
      # never the pre-push hook, so CI is the only place these fire on
      # anybody else's commit. `the-verify-chain-runs-in-ci.test.mjs` fails
      # when this list and `scripts/verify.sh` drift apart.
      - run: node scripts/generate-about.mjs --check
      - run: pnpm run check:releasing
      - run: node scripts/alpha-claims-match-the-version.mjs
      - run: node scripts/changelog.mjs --check
      - run: node scripts/every-package-ships-its-license.mjs
      # A leaked key in a public repository is not deletable: it is cloned
      # within minutes and rewriting history does not recall what was fetched.
      - run: node scripts/no-secrets-in-the-tree.mjs

  # ---------------------------------------------------------------------------
  # byollm_010: a platform CI does not run is a platform we do not support.
  #
  # The claude-cli backend was completely non-functional on Windows for the
  # whole of the alpha — not degraded, unusable — and we found out from a user
  # days after publishing. Nothing in the README says "macOS and Linux only",
  # and `npx byollm@alpha connect` reads as a promise to anyone with Node.
  # ---------------------------------------------------------------------------
  daemon-matrix:
    name: Daemon suite (${{ matrix.os }})
    # **The expensive legs, and when they run — B315.**
    #
    # 09-18 cost $32.82 in a day against a target near 3,000 minutes a MONTH:
    # 420 pushes across three repositories, and this repository runs three
    # matrix jobs x three OSes on every one. macOS bills at 10x and Windows at
    # 2x, so those two legs are almost the whole invoice.
    #
    # They run where the answer is worth the money: on a TAG (the release
    # proves all three on the commit it publishes — `byollm_010 §2`), on the
    # nightly (a Windows-only break is found within a day, which is the B313
    # shape and the reason the nightly exists), on `workflow_dispatch` when
    # somebody is chasing one, and on a pull request that touches the daemon.
    # ubuntu runs on every push, unconditionally.
    #
    # `github.event_name == 'push'` with a tag ref rather than `startsWith`
    # alone: a branch push and a tag push are both `push`, and only the ref
    # tells them apart.
    strategy:
      # Every platform reports. A Windows failure must not hide a macOS one.
      fail-fast: false
      matrix:
        # Parenthesised deliberately: `&&` binds tighter than `||` in a
        # GitHub expression, so `A || B || C && x || y` is
        # `A || B || (C && x) || y` — which yields the boolean `true`
        # rather than a JSON array, and `fromJSON(true)` is not a matrix.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # Run the built binary as a binary, on each platform. The bug that
      # started this was a spawn failure, which is exactly what a smoke test
      # of the real binary catches and a unit test does not.
      - run: pnpm run smoke
      - run: pnpm run test:unit
      # byollm_010 §3, open question: what does this OS put into a spawned
      # child regardless of the environment we hand it? macOS injects
      # `__CF_USER_TEXT_ENCODING`; the adversarial suite shows Windows
      # injecting more, and nobody has enumerated it. Informational on
      # purpose — the answer has to be read before it can be asserted, and an
      # assertion written to match whatever was observed tests nothing.
      - name: What this OS injects into a child (informational)
        run: pnpm --filter byollm run env-report

  adversarial:
    name: Adversarial corpus (${{ matrix.os }})
    # **The expensive legs, and when they run — B315.**
    #
    # 09-18 cost $32.82 in a day against a target near 3,000 minutes a MONTH:
    # 420 pushes across three repositories, and this repository runs three
    # matrix jobs x three OSes on every one. macOS bills at 10x and Windows at
    # 2x, so those two legs are almost the whole invoice.
    #
    # They run where the answer is worth the money: on a TAG (the release
    # proves all three on the commit it publishes — `byollm_010 §2`), on the
    # nightly (a Windows-only break is found within a day, which is the B313
    # shape and the reason the nightly exists), on `workflow_dispatch` when
    # somebody is chasing one, and on a pull request that touches the daemon.
    # ubuntu runs on every push, unconditionally.
    #
    # `github.event_name == 'push'` with a tag ref rather than `startsWith`
    # alone: a branch push and a tag push are both `push`, and only the ref
    # tells them apart.
    strategy:
      fail-fast: false
      matrix:
        # All three. byollm_010 §3 is answered: the six variables Windows
        # injects were measured on a real runner and are named in the suite,
        # with the two that carry something new called out rather than waved
        # through. The gate covers every platform we ship to.
        # Parenthesised deliberately: `&&` binds tighter than `||` in a
        # GitHub expression, so `A || B || C && x || y` is
        # `A || B || (C && x) || y` — which yields the boolean `true`
        # rather than a JSON array, and `fromJSON(true)` is not a matrix.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # byollm_004 §5: the hostile-payload corpus. Its failure blocks publish.
      # Includes the coverage check that every registered backend has rows.
      - run: pnpm run adversarial

  conformance-reference:
    name: Conformance — reference server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run conformance

  next-build:
    name: Next.js example builds (${{ matrix.os }})
    # **The expensive legs, and when they run — B315.**
    #
    # 09-18 cost $32.82 in a day against a target near 3,000 minutes a MONTH:
    # 420 pushes across three repositories, and this repository runs three
    # matrix jobs x three OSes on every one. macOS bills at 10x and Windows at
    # 2x, so those two legs are almost the whole invoice.
    #
    # They run where the answer is worth the money: on a TAG (the release
    # proves all three on the commit it publishes — `byollm_010 §2`), on the
    # nightly (a Windows-only break is found within a day, which is the B313
    # shape and the reason the nightly exists), on `workflow_dispatch` when
    # somebody is chasing one, and on a pull request that touches the daemon.
    # ubuntu runs on every push, unconditionally.
    #
    # `github.event_name == 'push'` with a tag ref rather than `startsWith`
    # alone: a branch push and a tag push are both `push`, and only the ref
    # tells them apart.
    # The same matrix byollm_010 requires for anything we let people install:
    # a bundler's behaviour is not one of the things that is the same
    # everywhere, and this is the integration nearly every adopter copies.
    strategy:
      fail-fast: false
      matrix:
        # Parenthesised deliberately: `&&` binds tighter than `||` in a
        # GitHub expression, so `A || B || C && x || y` is
        # `A || B || (C && x) || y` — which yields the boolean `true`
        # rather than a JSON array, and `fromJSON(true)` is not a matrix.
        os: ${{ fromJSON((startsWith(github.ref, 'refs/tags/') || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","macos-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # byollm_014. **No `BYOLLM_SITE_KEYS` in this environment**, and that
      # absence is the test — a build that only passes with keys set is not
      # reproducing what an integrator's CI does. Issue #4 was exactly this:
      # the documented pattern built its config at module scope, `next build`
      # imports route modules to collect page data, and it failed on a
      # credential it could not have. Unit tests could not see it; only a
      # framework's own build observes a failure inside that build.
      - run: pnpm --filter @byollm/example-next build

  freeze-gate:
    name: Freeze gate — skeleton relay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # cloud_004 §14: the demonstrations byollm_009 freezes against. A real
      # daemon and a real sealing site routed through a relay that holds no
      # keys — the protocol's first consumer that is neither endpoint.
      - run: pnpm run freeze-gate

  freeze-gate-postgres:
    name: Freeze gate — relay over Postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: supabase/setup-cli@v1
        with:
          version: 2.114.0
      - name: Start Supabase and export its credentials
        working-directory: packages/server
        run: |
          supabase start
          eval "$(supabase status -o env | sed 's/^/export /')"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      # The pre-stamp gate. The `uuid` lease-id bug routed perfectly against
      # MemoryStore and would have failed the first time a real site adopted
      # a lease — caught by reading a migration, which is luck rather than
      # process. REQUIRE_SUPABASE makes the run assert that it actually got
      # Postgres, so a stack that failed to start cannot report the same
      # green the bug already survived once.
      - name: Freeze gate against Postgres
        env:
          REQUIRE_SUPABASE: "1"
        run: pnpm run freeze-gate
      - name: Stop Supabase
        if: always()
        working-directory: packages/server
        run: supabase stop --no-backup

  conformance-supabase:
    name: Conformance — Supabase adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. A floating CLI means CI and a developer's
          # machine can run different Postgres images with different default
          # privileges — which is exactly how a migration passed locally and
          # failed here. Bump deliberately.
          version: 2.114.0
      - name: Start Supabase and export its credentials
        working-directory: packages/server
        run: |
          supabase start
          # The certify script needs the local stack's URL and service-role
          # key, and exits 2 without them — which is how this job silently
          # failed from the day it was added. These are the ephemeral keys
          # `supabase start` mints for a throwaway container, not secrets,
          # but they are masked so they never surface in a log.
          eval "$(supabase status -o env | sed 's/^/export /')"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Certify Supabase adapter
        run: pnpm --filter @byollm/conformance run certify:supabase
      - name: Stop Supabase
        if: always()
        working-directory: packages/server
        run: supabase stop --no-backup
