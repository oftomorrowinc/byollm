name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # The latest LTS line. Node 22 went to maintenance when 24 became LTS, and
  # trusted publishing needs >= 22.14 — so an old pin here fails a release for
  # a reason the error message never connects to CI.
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, types, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Build first: packages resolve each other through their published
      # `dist` types, so both linting and typechecking need them to exist and
      # to be current. Linting a stale `dist` reports `any` for real types.
      - run: pnpm run build
      # Run the built binary as a binary. Everything else drives the CLI
      # in-process, which is how a no-output `dist/bin.js` shipped once.
      - run: pnpm run smoke
      # The landing page makes claims about the API. Check them.
      - run: pnpm run check:site
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test:coverage
      - run: pnpm run knip
      - run: pnpm run dupes
      # docs/standards.md: every example executes in CI so docs cannot rot.
      - run: pnpm --filter @byollm/example-demo run check

  adversarial:
    name: Adversarial corpus (blocking security gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      # byollm_004 §5: the hostile-payload corpus. Its failure blocks publish.
      # Includes the coverage check that every registered backend has rows.
      - run: pnpm run adversarial

  conformance-reference:
    name: Conformance — reference server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run conformance

  conformance-supabase:
    name: Conformance — Supabase adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: supabase/setup-cli@v1
        with:
          # Pinned, not `latest`. A floating CLI means CI and a developer's
          # machine can run different Postgres images with different default
          # privileges — which is exactly how a migration passed locally and
          # failed here. Bump deliberately.
          version: 2.114.0
      - name: Start Supabase and export its credentials
        working-directory: packages/server
        run: |
          supabase start
          # The certify script needs the local stack's URL and service-role
          # key, and exits 2 without them — which is how this job silently
          # failed from the day it was added. These are the ephemeral keys
          # `supabase start` mints for a throwaway container, not secrets,
          # but they are masked so they never surface in a log.
          eval "$(supabase status -o env | sed 's/^/export /')"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"
      - name: Certify Supabase adapter
        run: pnpm --filter @byollm/conformance run certify:supabase
      - name: Stop Supabase
        if: always()
        working-directory: packages/server
        run: supabase stop --no-backup
