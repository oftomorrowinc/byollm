name: Release

# Publish to npm from GitHub Actions, with no token anywhere.
#
# npm trusted publishing exchanges a GitHub OIDC identity for a short-lived
# credential, so nothing long-lived exists to leak and a passkey never has to
# be in the loop. It requires a public repo, which is why this was not an
# option before the repo went public.
#
# One-time setup on npmjs.com, per package — see docs/releasing.md.

on:
  # The normal path: push a tag that matches the version.
  push:
    tags: ["v*"]
  # The rehearsal path: run it by hand, dry by default.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and check everything, but do not publish"
        type: boolean
        default: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # Reading CI's verdict on this commit — the `ci` job below.
  actions: read
  # The whole point: this is what lets the runner mint an OIDC token npm will
  # trust. Without it every publish fails with ENEEDAUTH.
  id-token: write

jobs:
  # Nothing publishes on a commit CI has not passed — cloud_008 §3.7.
  #
  # Release runs on a **tag** and CI runs on a **push**, so until this job
  # existed they were independent: alpha.19 published while CI was red, and
  # the failure was real — the Supabase adapter's schema was missing a column
  # the adapter had started writing. The tag said "ship it" and nothing asked
  # what CI thought of the same commit.
  #
  # `platforms` below re-runs the daemon suite on three operating systems,
  # which is a different question (byollm_010 §2) and does not cover the
  # conformance targets, the Supabase adapter, or lint and typecheck. This
  # waits for the CI run on this exact SHA rather than restating its contents,
  # so the two cannot drift.
  ci:
    name: CI passed on this commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          echo "waiting for CI on $SHA"
          for attempt in $(seq 1 60); do
            # `--json` over the checks API rather than the status API: CI is a
            # workflow, and a workflow that has not started yet reports
            # nothing at all rather than reporting pending.
            STATE="$(gh run list --commit "$SHA" --workflow CI               --json status,conclusion --jq               '[.[]] | if length == 0 then "missing"
                       elif any(.status != "completed") then "running"
                       elif all(.conclusion == "success") then "success"
                       else "failed" end')"
            case "$STATE" in
              success) echo "CI green on $SHA"; exit 0 ;;
              failed)  echo "::error::CI failed on $SHA — not publishing"; exit 1 ;;
              *)       echo "  $STATE ($attempt/60)"; sleep 20 ;;
            esac
          done
          echo "::error::CI did not finish for $SHA within 20 minutes"
          exit 1

  # byollm_010 §2: nothing publishes that has not been run on every platform
  # we let people install it on. The alpha shipped a daemon that was unusable
  # on Windows because the gate only ever ran on Linux — a blocking security
  # suite that covers one of three platforms is not blocking on the other two.
  platforms:
    name: Daemon + adversarial (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run smoke
      - run: pnpm run test:unit
      - run: pnpm run adversarial

  release:
    name: Publish to npm
    needs: [ci, platforms]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Same latest-LTS line as CI. Trusted publishing needs >= 22.14,
          # which 24 satisfies; the assertion below keeps that true if the
          # pin ever moves backwards.
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # npm >= 11.5.1 is required for OIDC. Node 24 ships something newer
      # already; this makes the requirement explicit rather than inherited,
      # so a future runner image cannot quietly drop below it.
      - name: Ensure an npm that can do OIDC
        run: |
          npm install -g npm@latest
          echo "npm $(npm --version), node $(node --version)"
          node -e 'const [a,b]=process.versions.node.split(".").map(Number);
            if (a<22||(a===22&&b<14)) { console.error("node too old for OIDC"); process.exit(1) }'

      - run: pnpm install --frozen-lockfile

      # ---------------------------------------------------------------------
      # Nothing ships that the gates have not passed. This duplicates CI on
      # purpose: a tag can point at any commit, including one CI never saw.
      # ---------------------------------------------------------------------
      - name: Full verification gate
        run: pnpm run verify
      # The adversarial corpus ran on all three platforms in `platforms`,
      # which this job depends on. Repeating it here on Linux only would add
      # a minute and no information.
      - name: Conformance — reference server
        run: pnpm run conformance

      # ---------------------------------------------------------------------
      # Guards. Each one is a mistake we would otherwise make silently.
      # ---------------------------------------------------------------------
      - name: Resolve and check the version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p 'require("./packages/protocol/package.json").version')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"

          # 0. Which packages ship, derived rather than listed.
          #
          #    This was hardcoded in four places, and `@byollm/relay` was
          #    added to none of them: it carried a version, a public
          #    `publishConfig` and no `private` flag, and a tagged release
          #    published four packages and silently skipped it. One value in
          #    four copies is the bug this repo keeps finding — here it cost
          #    a package rather than a signature.
          #
          #    Anything under packages/ that is not `private` ships. To keep
          #    a package out of a release, mark it private; there is no list
          #    to forget to update.
          PKGS="$(node -e '
            const { readdirSync, existsSync } = require("node:fs");
            const names = readdirSync("packages").filter((d) => {
              const m = `packages/${d}/package.json`;
              if (!existsSync(m)) return false;
              return require(`./${m}`).private !== true;
            });
            process.stdout.write(names.join(" "));
          ')"
          echo "Publishable packages: $PKGS"
          echo "packages=$PKGS" >> "$GITHUB_OUTPUT"

          # 1. Every package moves in lockstep. A stale one would publish a
          #    version whose siblings do not exist at the version it names.
          for pkg in $PKGS; do
            V="$(node -p "require('./packages/$pkg/package.json').version")"
            if [ "$V" != "$VERSION" ]; then
              echo "::error::packages/$pkg is $V but protocol is $VERSION — versions must match"
              exit 1
            fi
          done

          # 2. A tag must name the version it claims to release.
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME#v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "::error::tag v$TAG does not match package version $VERSION"
              exit 1
            fi
          fi

          # 3. npm versions are immutable, so a package already at this
          #    version cannot be republished. Two very different situations
          #    look alike here, and conflating them cost a version — cloud_008
          #    §37.
          #
          #    **All of them published** means somebody forgot to bump, and
          #    refusing is right.
          #
          #    **Some of them published** means a previous run stranded
          #    partway: alpha.20 got four packages out and lost
          #    `@byollm/server` to a Sigstore 409 on its provenance
          #    attestation. The old check refused that too, so the release was
          #    unresumable and the version had to be burned — while four
          #    resolvable packages sat on npm pointing at a fifth that was a
          #    version behind.
          #
          #    So: refuse a no-op, resume a partial one, and publish only what
          #    is missing.
          PUBLISHED=""
          MISSING=""
          for pkg in $PKGS; do
            name="$(node -p "require('./packages/$pkg/package.json').name")"
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              PUBLISHED="$PUBLISHED $name"
            else
              MISSING="$MISSING $name"
            fi
          done
          if [ -z "$MISSING" ]; then
            echo "::error::every package is already at $VERSION — bump the version"
            exit 1
          fi
          if [ -n "$PUBLISHED" ]; then
            echo "::warning::resuming a partial publish of $VERSION"
            echo "  already up:$PUBLISHED"
            echo "  to publish:$MISSING"
          fi
          echo "missing=$MISSING" >> "$GITHUB_OUTPUT"

          # 3a. A package this workflow has never published cannot be
          #     published by this workflow — and it finds out mid-loop.
          #
          #     Trusted publishing authorizes a workflow *for a package*, so
          #     the package has to exist before `npm trust` can name it. A
          #     brand-new name therefore takes one manual publish first;
          #     `docs/releasing.md` says so, and saying so is all that stood
          #     between here and what happened at alpha.58: `@byollm/relay`
          #     went that way at alpha.5 and nothing carried the lesson
          #     forward, so `@byollm/control-plane` collected a 404 on `PUT`
          #     with one sibling already published and four still to go.
          #
          #     The half-published state is bad enough. Worse is that the
          #     refusal arrives from npm, in the middle of the one step that
          #     is not idempotent across packages, for a reason nothing in the
          #     run's own output predicts. §3b exists for exactly this class —
          #     "the cost of learning it mid-loop is a version number nobody
          #     can reuse" — and this is the same sentence about a different
          #     precondition.
          #
          #     Checked against the registry rather than against a list in
          #     this file: a hand-kept roster of which packages are set up is
          #     the thing that goes stale the release after somebody writes
          #     it. The question asked is the real one — does npm know this
          #     name at all.
          for pkg in $PKGS; do
            name="$(node -p "require('./packages/$pkg/package.json').name")"
            # `npm view <name> name` succeeds for any published version, so a
            # package mid-partial-publish still answers. Only a name npm has
            # never seen fails, which is precisely the first-publish case.
            if ! npm view "$name" name >/dev/null 2>&1; then
              echo "::error::$name has never been published, so trusted publishing cannot be configured for it and this run would fail on PUT after publishing its siblings."
              echo "::error::Publish it once by hand, then authorise the workflow:"
              echo "::error::  npm publish --access public   # from packages/$pkg, with 2FA"
              echo "::error::  npm trust github \"$name\" --file release.yml --repo oftomorrowinc/byollm --allow-publish -y"
              echo "::error::See docs/releasing.md, 'One-time setup'."
              exit 1
            fi
          done

          # 3b. Provenance needs `repository.url` to match the repo it was
          #     built from, and npm rejects the publish with a 422 when it does
          #     not. `@byollm/relay` shipped without one: it published by hand
          #     at alpha.5, where nothing checks provenance, and failed on its
          #     first workflow release — after three siblings had already gone
          #     out, leaving a half-published version. Checked here, before
          #     anything is published, because the cost of learning it mid-loop
          #     is a version number nobody can reuse.
          for pkg in $PKGS; do
            URL="$(node -p "require('./packages/$pkg/package.json').repository?.url ?? ''")"
            case "$URL" in
              *oftomorrowinc/byollm*) ;;
              *) echo "::error::packages/$pkg has no repository.url — npm will reject its provenance"; exit 1 ;;
            esac
          done

          # 4. A prerelease goes to its own dist-tag, never to `latest`.
          case "$VERSION" in
            *-alpha.*) TAG_NAME=alpha ;;
            *-beta.*)  TAG_NAME=beta ;;
            *-*)       TAG_NAME=next ;;
            *)         TAG_NAME=latest ;;
          esac
          echo "npm_tag=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Publishing under dist-tag: $TAG_NAME"

      # ---------------------------------------------------------------------
      # Pack with pnpm, publish with npm.
      #
      # This split is deliberate. `pnpm pack` rewrites `workspace:*` to the
      # pinned version — publishing with npm alone would ship a manifest
      # depending on a protocol nobody can resolve. `npm publish` is what
      # speaks OIDC. Handing npm a tarball pnpm packed gets both.
      # ---------------------------------------------------------------------
      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p dist-tarballs
          for pkg in ${{ steps.version.outputs.packages }}; do
            ( cd "packages/$pkg" && pnpm pack --pack-destination ../../dist-tarballs )
          done
          ls -la dist-tarballs
          # A workspace: spec surviving into a tarball would install as a
          # broken dependency for everyone. Cheap to assert, fatal to miss.
          for t in dist-tarballs/*.tgz; do
            if tar -xzOf "$t" package/package.json | grep -q '"workspace:'; then
              echo "::error::$t still contains a workspace: dependency"
              exit 1
            fi
          done

      - name: Publish (dry run)
        if: inputs.dry_run
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Run the real command with --dry-run, rather than just listing what
          # would go out. The first version of this only printed filenames,
          # and so sailed past a publish command npm could not even parse —
          # a rehearsal that does not invoke the thing proves the least
          # interesting part.
          for pkg in ${{ steps.version.outputs.packages }}; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            FILE="./dist-tarballs/$(printf '%s' "$NAME" | sed 's|^@||; s|/|-|')-$V.tgz"
            echo "==> would publish $NAME from $FILE"
            npm publish "$FILE" --tag "${{ steps.version.outputs.npm_tag }}" --access public --dry-run
          done
          echo ""
          echo "Nothing was published. Note that --dry-run does not exercise"
          echo "OIDC auth, so this proves the build, the guards and the"
          echo "publish invocation — not the npmjs.com trusted-publisher"
          echo "configuration. Only a real run tests that."

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.version }}"
          # Dependency order, so a package never lands before something it
          # names. npm does not enforce this; humans reading the registry do.
          #
          # The tarball name is derived from the manifest rather than matched
          # by pattern: the daemon's directory is `daemon` but its package is
          # `byollm`, so `byollm-0.1.0-….tgz` and `byollm-server-0.1.0-….tgz`
          # both match any glob loose enough to catch the first.
          for pkg in ${{ steps.version.outputs.packages }}; do
            NAME="$(node -p "require('./packages/$pkg/package.json').name")"
            # The `./` is load-bearing. `npm publish <spec>` resolves a bare
            # `a/b` as the GitHub shorthand `github:a/b`, so a relative path
            # sends npm off to clone `dist-tarballs/byollm-protocol-….tgz` as
            # a repository — which is exactly what it tried, with EALLOWGIT.
            # A leading `./` is what marks it as a file.
            FILE="./dist-tarballs/$(printf '%s' "$NAME" | sed 's|^@||; s|/|-|')-$V.tgz"
            if [ ! -f "$FILE" ]; then
              echo "::error::expected tarball $FILE for $NAME, which pnpm pack did not produce"
              exit 1
            fi
            # Idempotent per package — cloud_008 §37. A re-run of a stranded
            # release converges instead of failing on the ones that made it.
            if npm view "$NAME@$V" version >/dev/null 2>&1; then
              echo "==> $NAME@$V is already published — skipping"
              continue
            fi
            echo "==> publishing $NAME from $FILE"
            npm publish "$FILE" --tag "${{ steps.version.outputs.npm_tag }}" --access public
          done

      # ---------------------------------------------------------------------
      # Verify the artifact, not the run.
      #
      # `set -e` already fails this job if a publish fails — that is how
      # `alpha.6` went red. What it did not tell anyone is that four packages
      # were live by then. A partial release is the dangerous state: some
      # packages at the new version, others behind, and every one of them
      # resolvable by anyone who installs.
      #
      # So the last word on a release comes from the registry rather than from
      # this job's own exit code. It is also the only form of the question that
      # cannot be answered about the wrong release — there is no run to match.
      # ---------------------------------------------------------------------
      #
      # Exit 3 is "could not read", not "wrong" — ruled 2026-09-04. The check
      # cried wolf on three consecutive cuts, every time on the largest
      # package, while every version was live. A red that is benign three
      # times running is a red people learn to ignore, which is the failure
      # this step exists to prevent. So a timed-out read is reported as
      # unproven and the job stays green; a partial release still fails it.
      # The prover is not the proven.
      - name: Verify the registry actually has it
        if: ${{ !inputs.dry_run }}
        run: |
          set +e
          node scripts/release-check.mjs "${{ steps.version.outputs.version }}"
          verdict=$?
          set -e
          if [ "$verdict" -eq 3 ]; then
            echo "::warning title=Release unproven::The registry did not answer for every package in time. Every package this check could read is at ${{ steps.version.outputs.version }}. Look with 'npm view <pkg>@${{ steps.version.outputs.version }} version' before assuming a partial release."
            exit 0
          fi
          exit "$verdict"

      # ---------------------------------------------------------------------
      # The `latest` retag — deliberately NOT attempted here.
      #
      # npm forces `latest` onto a first publish and will not let it be
      # removed, so a bare `npm install byollm` resolves somewhere regardless.
      # We keep it pointed at the newest alpha so that install gets the version
      # whose README carries the current warning, not one silently older.
      #
      # But OIDC does not cover it. Settled empirically in the 0.1.0-alpha.3
      # release: `npm publish` exchanges the OIDC credential correctly, and
      # `npm dist-tag` in the same job fell straight through to the placeholder
      # NODE_AUTH_TOKEN that setup-node writes, and died with E401. A trusted
      # publisher authorizes publishing; a retag is a different write.
      #
      # So the workflow prints the commands rather than running a call that
      # cannot succeed. A step that always fails teaches everyone to ignore it,
      # which is worse than not having it.
      # ---------------------------------------------------------------------
      - name: Report
        if: ${{ !inputs.dry_run }}
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.npm_tag }}"
          {
            echo "## Published \`$V\` under \`$TAG\`"
            echo ""
            for pkg in ${{ steps.version.outputs.packages }}; do
              n="$(node -p "require('./packages/$pkg/package.json').name")"
              echo "- https://www.npmjs.com/package/$n/v/$V"
            done
            if [ "$TAG" != "latest" ]; then
              echo ""
              echo "### One manual step left"
              echo ""
              echo "\`latest\` still points at the previous release. OIDC does not"
              echo "cover \`npm dist-tag\`, so this cannot run here — see"
              echo "docs/releasing.md. Run locally (a passkey prompt per package):"
              echo ""
              echo '```bash'
              for pkg in ${{ steps.version.outputs.packages }}; do
                n="$(node -p "require('./packages/$pkg/package.json').name")"
                echo "npm dist-tag add $n@$V latest"
              done
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
